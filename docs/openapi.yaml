openapi: 3.1.0
info:
  title: GeoPTT API
  description: "\nAPI de rastreamento em tempo real e Push-To-Talk do GeoPTT.\n\n* **REST** — autenticação, círculos, localização em lote e canais PTT.\n* **WebSocket** `/ws` — presença, áudio Opus (binário) e controle (JSON).\n* **Resiliência** — quando o destinatário não tem socket ativo, o servidor dispara\n  uma Data Message de alta prioridade via FCM para acordar o app.\n"
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Liveness probe
      description: Responde 200 se o processo está vivo. Não toca no banco.
      operationId: liveness_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Liveness Health Get
  /health/ready:
    get:
      tags:
      - health
      summary: Readiness probe
      description: Verifica banco e FCM. Retorna 503 se algo essencial estiver indisponível.
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Cria conta e devolve o par de tokens
      operationId: register_api_v1_auth_register_post
      parameters:
      - name: X-Device-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
          description: 'Identificador estável do dispositivo (ex.: installation id).'
          title: X-Device-Id
        description: 'Identificador estável do dispositivo (ex.: installation id).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflito de estado (e-mail, convite, associação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requisições por IP excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: OAuth2 password flow (username = e-mail)
      operationId: login_api_v1_auth_login_post
      parameters:
      - name: X-Device-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
          description: 'Identificador estável do dispositivo (ex.: installation id).'
          title: X-Device-Id
        description: 'Identificador estável do dispositivo (ex.: installation id).'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_auth_login_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requisições por IP excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotaciona o par de tokens (o refresh usado é revogado)
      operationId: refresh_api_v1_auth_refresh_post
      parameters:
      - name: X-Device-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
          description: 'Identificador estável do dispositivo (ex.: installation id).'
          title: X-Device-Id
        description: 'Identificador estável do dispositivo (ex.: installation id).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoga o refresh do dispositivo (ou todas as sessões)
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
  /api/v1/users/me:
    get:
      tags:
      - users
      summary: Perfil do usuário autenticado
      operationId: read_me_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
    patch:
      tags:
      - users
      summary: Atualiza perfil (parcial)
      operationId: update_me_api_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
  /api/v1/users/me/fcm-token:
    post:
      tags:
      - users
      summary: Registra o token FCM do dispositivo (idempotente)
      operationId: register_fcm_token_api_v1_users_me_fcm_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
    delete:
      tags:
      - users
      summary: Remove o token FCM (logout)
      operationId: delete_fcm_token_api_v1_users_me_fcm_token_delete
      responses:
        '204':
          description: Successful Response
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
  /api/v1/circles:
    get:
      tags:
      - circles
      summary: Círculos do usuário
      operationId: list_circles_api_v1_circles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircleListResponse'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Autenticado, mas sem permissão para a operação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflito de estado (e-mail, convite, associação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
    post:
      tags:
      - circles
      summary: Cria círculo (owner + canal PTT 'Geral')
      operationId: create_circle_api_v1_circles_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircleCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirclePublic'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Autenticado, mas sem permissão para a operação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflito de estado (e-mail, convite, associação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
  /api/v1/circles/join:
    post:
      tags:
      - circles
      summary: Entra por código de convite
      operationId: join_circle_api_v1_circles_join_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircleJoinRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirclePublic'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Autenticado, mas sem permissão para a operação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflito de estado (e-mail, convite, associação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
  /api/v1/circles/{circle_id}/members:
    get:
      tags:
      - circles
      summary: Membros com última posição conhecida
      operationId: list_members_api_v1_circles__circle_id__members_get
      security:
      - AccessToken: []
      parameters:
      - name: circle_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Circle Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircleMembersResponse'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Autenticado, mas sem permissão para a operação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflito de estado (e-mail, convite, associação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/circles/{circle_id}/members/{user_id}:
    delete:
      tags:
      - circles
      summary: Remove membro (ou sai do círculo, se for você)
      operationId: remove_member_api_v1_circles__circle_id__members__user_id__delete
      security:
      - AccessToken: []
      parameters:
      - name: circle_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Circle Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Autenticado, mas sem permissão para a operação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflito de estado (e-mail, convite, associação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/location/batch:
    post:
      tags:
      - location
      summary: Ingere até 50 pontos (idempotente por client_seq)
      operationId: ingest_batch_api_v1_location_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationBatchResponse'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AccessToken: []
  /api/v1/location/circle/{circle_id}:
    get:
      tags:
      - location
      summary: Snapshot de posições do círculo (para o mapa)
      operationId: circle_positions_api_v1_location_circle__circle_id__get
      security:
      - AccessToken: []
      parameters:
      - name: circle_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Circle Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirclePositionsResponse'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recurso inexistente **ou** fora do alcance do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    Body_login_api_v1_auth_login_post:
      properties:
        grant_type:
          anyOf:
          - type: string
            pattern: ^password$
          - type: 'null'
          title: Grant Type
        username:
          type: string
          title: Username
        password:
          type: string
          format: password
          title: Password
        scope:
          type: string
          title: Scope
          default: ''
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
      type: object
      required:
      - username
      - password
      title: Body_login_api_v1_auth_login_post
    CircleCreate:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
      additionalProperties: false
      type: object
      required:
      - name
      title: CircleCreate
    CircleJoinRequest:
      properties:
        invite_code:
          type: string
          maxLength: 12
          minLength: 6
          title: Invite Code
      additionalProperties: false
      type: object
      required:
      - invite_code
      title: CircleJoinRequest
    CircleListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CirclePublic'
          type: array
          title: Items
      type: object
      required:
      - items
      title: CircleListResponse
    CircleMemberPublic:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        display_name:
          type: string
          title: Display Name
        role:
          $ref: '#/components/schemas/CircleRole'
        battery_level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Battery Level
        is_sharing_location:
          type: boolean
          title: Is Sharing Location
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen At
        lat:
          anyOf:
          - type: number
          - type: 'null'
          title: Lat
        lng:
          anyOf:
          - type: number
          - type: 'null'
          title: Lng
        accuracy_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Accuracy M
        speed_mps:
          anyOf:
          - type: number
          - type: 'null'
          title: Speed Mps
        heading_deg:
          anyOf:
          - type: number
          - type: 'null'
          title: Heading Deg
        recorded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Recorded At
      type: object
      required:
      - user_id
      - display_name
      - role
      - is_sharing_location
      title: CircleMemberPublic
      description: 'Membro + última posição conhecida (para o mapa).


        `lat`/`lng` são `null` quando o membro ainda não enviou ping ou quando

        desligou o compartilhamento (`is_sharing_location = false`).'
    CircleMembersResponse:
      properties:
        circle_id:
          type: string
          format: uuid
          title: Circle Id
        items:
          items:
            $ref: '#/components/schemas/CircleMemberPublic'
          type: array
          title: Items
      type: object
      required:
      - circle_id
      - items
      title: CircleMembersResponse
    CirclePositionsResponse:
      properties:
        circle_id:
          type: string
          format: uuid
          title: Circle Id
        items:
          items:
            $ref: '#/components/schemas/PositionPublic'
          type: array
          title: Items
      type: object
      required:
      - circle_id
      - items
      title: CirclePositionsResponse
    CirclePublic:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        owner_id:
          type: string
          format: uuid
          title: Owner Id
        invite_code:
          type: string
          title: Invite Code
        role:
          $ref: '#/components/schemas/CircleRole'
        member_count:
          type: integer
          title: Member Count
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - owner_id
      - invite_code
      - role
      - member_count
      - created_at
      title: CirclePublic
      description: Círculo visto por quem é membro (o `invite_code` permite convidar).
    CircleRole:
      type: string
      enum:
      - owner
      - admin
      - member
      title: CircleRole
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
          description: 'Código estável do erro, ex.: EMAIL_TAKEN'
        message:
          type: string
          title: Message
          description: Mensagem legível, em português
      type: object
      required:
      - code
      - message
      title: ErrorDetail
      description: Código estável (para o cliente decidir o que fazer) + mensagem humana.
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/ValidationDetail'
            type: array
          - type: 'null'
          title: Details
      type: object
      required:
      - error
      title: ErrorEnvelope
    FcmTokenRequest:
      properties:
        fcm_token:
          type: string
          maxLength: 255
          minLength: 10
          title: Fcm Token
        platform:
          $ref: '#/components/schemas/Platform'
      additionalProperties: false
      type: object
      required:
      - fcm_token
      - platform
      title: FcmTokenRequest
      description: Registro idempotente do token FCM do dispositivo.
    LocationBatchRequest:
      properties:
        points:
          items:
            $ref: '#/components/schemas/LocationPoint'
          type: array
          maxItems: 50
          minItems: 1
          title: Points
      additionalProperties: false
      type: object
      required:
      - points
      title: LocationBatchRequest
      description: Lote enviado por REST (fila offline) **ou** por WebSocket (`LOCATION_BATCH`).
    LocationBatchResponse:
      properties:
        accepted:
          type: integer
          title: Accepted
          description: Pontos gravados no histórico
        duplicated:
          type: integer
          title: Duplicated
          description: Pontos ignorados por `client_seq` já visto
        server_ts:
          type: integer
          title: Server Ts
      type: object
      required:
      - accepted
