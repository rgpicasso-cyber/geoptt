# GeoPTT Nginx configuration
# Place in /etc/nginx/sites-available/geoptt and link to sites-enabled

upstream geoptt_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name geoptt.example.com;   # replace with your domain

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name geoptt.example.com;   # replace with your domain

    ssl_certificate /etc/letsencrypt/live/geoptt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geoptt.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Increase proxy buffers for WebSocket frames
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://geoptt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # WebSocket endpoint – upgrade handling required for PTT
    location /ws {
        proxy_pass http://geoptt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts tuned for long-lived PTT connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Static files (if any) – optional
    location /static/ {
        alias /opt/geoptt/static/;
        expires 30d;
    }
}