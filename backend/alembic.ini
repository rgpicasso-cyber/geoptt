[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

# A URL real é injetada em `alembic/env.py` a partir de DATABASE_URL.
# Este valor é apenas um placeholder para comandos offline.
sqlalchemy.url = postgresql+asyncpg://geoptt:geoptt@127.0.0.1:5432/geoptt

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
